<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="-apple-system, Segoe UI, Roboto, Helvetica, sans-serif">
  <defs>
    <filter id="f" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#14161A" flood-opacity="0.10"/>
    </filter>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L9 5 L0 10 z" fill="#14161A"/>
    </marker>
  </defs>

  <rect width="1000" height="560" fill="#FFF7EC" rx="18"/>

  <text x="40" y="52" font-size="26" font-weight="700" fill="#14161A">How we got from a brief to this app</text>
  <text x="40" y="78" font-size="15" fill="#565A62">Five stages. Each one ends with a decision, not a document.</text>

  <g fill="none" stroke="#14161A" stroke-width="2.5" marker-end="url(#a)">
    <path d="M198 176 H222"/>
    <path d="M389 176 H413"/>
    <path d="M580 176 H604"/>
    <path d="M771 176 H795"/>
  </g>

  <!-- stage cards -->
  <g filter="url(#f)">
    <rect x="36" y="112" width="162" height="128" rx="20" fill="#F0EAFC" stroke="#14161A" stroke-width="2.5"/>
    <rect x="227" y="112" width="162" height="128" rx="20" fill="#E2F1F7" stroke="#14161A" stroke-width="2.5"/>
    <rect x="418" y="112" width="162" height="128" rx="20" fill="#FAE9F5" stroke="#14161A" stroke-width="2.5"/>
    <rect x="609" y="112" width="162" height="128" rx="20" fill="#FBF0DC" stroke="#14161A" stroke-width="2.5"/>
    <rect x="800" y="112" width="164" height="128" rx="20" fill="#EEF5E2" stroke="#14161A" stroke-width="2.5"/>
  </g>

  <g font-size="26" text-anchor="middle">
    <text x="117" y="152">🔎</text><text x="308" y="152">🧠</text><text x="499" y="152">✂️</text>
    <text x="690" y="152">🛠️</text><text x="882" y="152">🔁</text>
  </g>
  <g font-size="16" font-weight="700" fill="#14161A" text-anchor="middle">
    <text x="117" y="184">Discover</text><text x="308" y="184">Diverge</text><text x="499" y="184">Decide</text>
    <text x="690" y="184">Build</text><text x="882" y="184">Iterate</text>
  </g>
  <g font-size="12.5" fill="#14161A" text-anchor="middle">
    <text x="117" y="206">Who burns out,</text><text x="117" y="223">and why</text>
    <text x="308" y="206">Eight ideas,</text><text x="308" y="223">no filtering</text>
    <text x="499" y="206">Kill four on</text><text x="499" y="223">stated criteria</text>
    <text x="690" y="206">Riskiest part</text><text x="690" y="223">first</text>
    <text x="882" y="206">Use it, then</text><text x="882" y="223">replace it</text>
  </g>

  <text x="40" y="290" font-size="13" font-weight="700" fill="#6B7079" letter-spacing="1.2">WHAT CAME OUT OF EACH</text>

  <g filter="url(#f)"><rect x="36" y="304" width="928" height="212" rx="20" fill="#FFFFFF" stroke="#C9C6BE" stroke-width="2"/></g>

  <g font-size="13.5">
    <text x="64" y="338" font-weight="700" fill="#6B3FC0">🔎 Discover</text>
    <text x="188" y="338" fill="#14161A">Six root causes, one insight: it is never one big thing, and nobody is counting the small ones.</text>

    <text x="64" y="374" font-weight="700" fill="#0C6E8F">🧠 Diverge</text>
    <text x="188" y="374" fill="#14161A">Timers, journals, streaks, an LLM planner — everything on the board before anything was judged.</text>

    <text x="64" y="410" font-weight="700" fill="#A63A8C">✂️ Decide</text>
    <text x="188" y="410" fill="#14161A">Three rules: must work offline · must change the week, not describe it · must never punish a bad week.</text>

    <text x="64" y="446" font-weight="700" fill="#7A5200">🛠️ Build</text>
    <text x="188" y="446" fill="#14161A">The load model first, because if `time × dread` was not convincing, nothing above it would matter.</text>

    <text x="64" y="482" font-weight="700" fill="#1B5C46">🔁 Iterate</text>
    <text x="188" y="482" fill="#14161A">Eight features replaced after living with them. Every figure asserted so a change cannot pass quietly.</text>
  </g>
</svg>
