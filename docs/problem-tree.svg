<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="-apple-system, Segoe UI, Roboto, Helvetica, sans-serif">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF7EC"/><stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#14161A" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="960" height="640" fill="url(#sky)" rx="18"/>

  <text x="40" y="56" font-size="26" font-weight="700" fill="#14161A">Why students burn out</text>
  <text x="40" y="82" font-size="15" fill="#565A62">One thing you can feel. Six causes nobody was counting.</text>

  <!-- the symptom -->
  <g filter="url(#soft)">
    <rect x="238" y="110" width="484" height="76" rx="38" fill="#16261F"/>
  </g>
  <text x="480" y="145" font-size="19" font-weight="700" fill="#F7F6F2" text-anchor="middle">“I’m exhausted and I don’t know why.”</text>
  <text x="480" y="169" font-size="13" fill="#A8A9A3" text-anchor="middle">The only symptom a student can actually see</text>

  <path d="M480 186 V214" stroke="#C9C6BE" stroke-width="3" stroke-linecap="round"/>
  <path d="M140 214 H820" stroke="#C9C6BE" stroke-width="3" stroke-linecap="round"/>
  <path d="M140 214 V240 M480 214 V240 M820 214 V240" stroke="#C9C6BE" stroke-width="3" stroke-linecap="round"/>
  <path d="M140 372 V398 M480 372 V398 M820 372 V398" stroke="#C9C6BE" stroke-width="3" stroke-linecap="round" opacity="0.55"/>

  <!-- row 1 -->
  <g filter="url(#soft)">
    <rect x="26" y="240" width="288" height="132" rx="20" fill="#F0EAFC" stroke="#14161A" stroke-width="2.5"/>
    <rect x="336" y="240" width="288" height="132" rx="20" fill="#E2F1F7" stroke="#14161A" stroke-width="2.5"/>
    <rect x="646" y="240" width="288" height="132" rx="20" fill="#FAE9F5" stroke="#14161A" stroke-width="2.5"/>
  </g>

  <circle cx="66" cy="280" r="19" fill="#C4A9F0" stroke="#14161A" stroke-width="2.2"/>
  <path d="M66 269 v11 l7 5" stroke="#14161A" stroke-width="2.4" fill="none" stroke-linecap="round"/>
  <text x="98" y="278" font-size="16" font-weight="700" fill="#14161A">Hours are not the cost</text>
  <text x="48" y="312" font-size="13.5" fill="#14161A">An hour of laundry and an hour of a group</text>
  <text x="48" y="332" font-size="13.5" fill="#14161A">presentation are not the same hour. Every</text>
  <text x="48" y="352" font-size="13.5" fill="#14161A">planner measures hours.</text>

  <circle cx="376" cy="280" r="19" fill="#9CCDF5" stroke="#14161A" stroke-width="2.2"/>
  <path d="M368 274h16M368 280h16M368 286h10" stroke="#14161A" stroke-width="2.2" stroke-linecap="round"/>
  <text x="408" y="278" font-size="16" font-weight="700" fill="#14161A">Half the week is uncounted</text>
  <text x="358" y="312" font-size="13.5" fill="#14161A">Shifts, commuting, chores, caring. For a</text>
  <text x="358" y="332" font-size="13.5" fill="#14161A">student working 12 hours a week that is</text>
  <text x="358" y="352" font-size="13.5" fill="#14161A">most of the load — and nobody asks.</text>

  <circle cx="686" cy="280" r="19" fill="#FFB3D1" stroke="#14161A" stroke-width="2.2"/>
  <rect x="678" y="272" width="16" height="5" rx="2" fill="#14161A"/>
  <rect x="678" y="280" width="16" height="5" rx="2" fill="#14161A"/>
  <rect x="678" y="288" width="10" height="5" rx="2" fill="#14161A"/>
  <text x="718" y="278" font-size="16" font-weight="700" fill="#14161A">Clustering, not volume</text>
  <text x="668" y="312" font-size="13.5" fill="#14161A">Three deadlines across ten days is an</text>
  <text x="668" y="332" font-size="13.5" fill="#14161A">ordinary fortnight. The same three inside</text>
  <text x="668" y="352" font-size="13.5" fill="#14161A">72 hours is what breaks people.</text>

  <!-- row 2 -->
  <g filter="url(#soft)">
    <rect x="26" y="398" width="288" height="132" rx="20" fill="#FBF0DC" stroke="#14161A" stroke-width="2.5"/>
    <rect x="336" y="398" width="288" height="132" rx="20" fill="#EEF5E2" stroke="#14161A" stroke-width="2.5"/>
    <rect x="646" y="398" width="288" height="132" rx="20" fill="#FBE9EC" stroke="#14161A" stroke-width="2.5"/>
  </g>

  <circle cx="66" cy="438" r="19" fill="#FFD37A" stroke="#14161A" stroke-width="2.2"/>
  <path d="M57 432h18v10h-9l-5 5v-5h-4z" fill="#14161A"/>
  <text x="98" y="436" font-size="16" font-weight="700" fill="#14161A">Saying no is expensive</text>
  <text x="48" y="470" font-size="13.5" fill="#14161A">The hard part is not knowing what to cut.</text>
  <text x="48" y="490" font-size="13.5" fill="#14161A">It is sitting down to compose the message,</text>
  <text x="48" y="510" font-size="13.5" fill="#14161A">which is why it waits four days.</text>

  <circle cx="376" cy="438" r="19" fill="#8FE0C2" stroke="#14161A" stroke-width="2.2"/>
  <path d="M369 438l5 5 9-10" stroke="#14161A" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="408" y="436" font-size="16" font-weight="700" fill="#14161A">Logging is itself work</text>
  <text x="358" y="470" font-size="13.5" fill="#14161A">The student who most needs a tracker has</text>
  <text x="358" y="490" font-size="13.5" fill="#14161A">the least capacity to keep one. Most apps</text>
  <text x="358" y="510" font-size="13.5" fill="#14161A">ask for minutes a day.</text>

  <circle cx="686" cy="438" r="19" fill="#FF8FAB" stroke="#14161A" stroke-width="2.2"/>
  <path d="M686 428a7 7 0 0 0-7 7v6l-2 3h18l-2-3v-6a7 7 0 0 0-7-7zM683 448a3 3 0 0 0 6 0" fill="#14161A"/>
  <text x="718" y="436" font-size="16" font-weight="700" fill="#14161A">Warnings arrive too late</text>
  <text x="668" y="470" font-size="13.5" fill="#14161A">A notification the night before is not a</text>
  <text x="668" y="490" font-size="13.5" fill="#14161A">warning. It is a commiseration. You need</text>
  <text x="668" y="510" font-size="13.5" fill="#14161A">days, not hours.</text>

  <text x="40" y="574" font-size="13" font-weight="700" fill="#6B7079">WHO IT LANDS ON</text>
  <text x="40" y="596" font-size="13.5" fill="#565A62">The student first. Then flatmates and friends who absorb the cancelled plans, tutors and shift managers who get</text>
  <text x="40" y="616" font-size="13.5" fill="#565A62">the late request, and university wellbeing services — who see everyone else's week too late to change it.</text>
</svg>
