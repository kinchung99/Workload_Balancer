<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" width="1000" height="760" font-family="-apple-system, Segoe UI, Roboto, Helvetica, sans-serif">
  <defs>
    <filter id="f" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#14161A" flood-opacity="0.10"/>
    </filter>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L9 5 L0 10 z" fill="#6B7079"/>
    </marker>
  </defs>

  <rect width="1000" height="760" fill="#FFF7EC" rx="18"/>

  <text x="40" y="52" font-size="26" font-weight="700" fill="#14161A">Five features, and the moment each came from</text>
  <text x="40" y="78" font-size="15" fill="#565A62">Left: something a student already does. Right: what we built because of it.</text>

  <g font-size="12" font-weight="700" fill="#6B7079" letter-spacing="1.2">
    <text x="40" y="116">THE MOMENT</text>
    <text x="556" y="116">WHAT WE BUILT</text>
  </g>

  <!-- 1 -->
  <g filter="url(#f)"><rect x="36" y="130" width="420" height="106" rx="20" fill="#FFFFFF" stroke="#C9C6BE" stroke-width="2"/></g>
  <circle cx="76" cy="168" r="20" fill="#FFB3D1" stroke="#14161A" stroke-width="2.2"/>
  <text x="76" y="175" font-size="19" text-anchor="middle">📄</text>
  <text x="112" y="164" font-size="15.5" font-weight="700" fill="#14161A">“It’s due Thursday, I’ll start Wednesday.”</text>
  <text x="112" y="188" font-size="13.5" fill="#565A62">A to-do list shows an assignment on one day. The nine</text>
  <text x="112" y="208" font-size="13.5" fill="#565A62">hours it needs are invisible until the night they ruin.</text>
  <path d="M470 183 H540" stroke="#6B7079" stroke-width="2.5" marker-end="url(#a)"/>
  <g filter="url(#f)"><rect x="552" y="130" width="412" height="106" rx="20" fill="#FAE9F5" stroke="#14161A" stroke-width="2.5"/></g>
  <text x="578" y="164" font-size="16" font-weight="700" fill="#14161A">Owing — work, not a date</text>
  <text x="578" y="188" font-size="13.5" fill="#14161A">Sits on every day until done. Done / booked / loose</text>
  <text x="578" y="208" font-size="13.5" fill="#14161A">tracked apart, and it books your sittings for you.</text>

  <!-- 2 -->
  <g filter="url(#f)"><rect x="36" y="254" width="420" height="106" rx="20" fill="#FFFFFF" stroke="#C9C6BE" stroke-width="2"/></g>
  <circle cx="76" cy="292" r="20" fill="#C4A9F0" stroke="#14161A" stroke-width="2.2"/>
  <text x="76" y="299" font-size="19" text-anchor="middle">🌙</text>
  <text x="112" y="288" font-size="15.5" font-weight="700" fill="#14161A">“I should rest, but badminton isn’t in any app.”</text>
  <text x="112" y="312" font-size="13.5" fill="#565A62">Wellbeing apps prescribe meditation. Real students</text>
  <text x="112" y="332" font-size="13.5" fill="#565A62">recover doing the thing they already love.</text>
  <path d="M470 307 H540" stroke="#6B7079" stroke-width="2.5" marker-end="url(#a)"/>
  <g filter="url(#f)"><rect x="552" y="254" width="412" height="106" rx="20" fill="#F0EAFC" stroke="#14161A" stroke-width="2.5"/></g>
  <text x="578" y="288" font-size="16" font-weight="700" fill="#14161A">Tonight — your evening, your hobbies</text>
  <text x="578" y="312" font-size="13.5" fill="#14161A">Add your own activity as a permanent slider. See the</text>
  <text x="578" y="332" font-size="13.5" fill="#14161A">cost before you commit, then book it at a real hour.</text>

  <!-- 3 -->
  <g filter="url(#f)"><rect x="36" y="378" width="420" height="106" rx="20" fill="#FFFFFF" stroke="#C9C6BE" stroke-width="2"/></g>
  <circle cx="76" cy="416" r="20" fill="#9CCDF5" stroke="#14161A" stroke-width="2.2"/>
  <text x="76" y="423" font-size="19" text-anchor="middle">🎓</text>
  <text x="112" y="412" font-size="15.5" font-weight="700" fill="#14161A">“That’s the lecture he drops exam hints in.”</text>
  <text x="112" y="436" font-size="13.5" fill="#565A62">Fourteen contact hours, and every planner treats them</text>
  <text x="112" y="456" font-size="13.5" fill="#565A62">as identical blocks you either attend or skip.</text>
  <path d="M470 431 H540" stroke="#6B7079" stroke-width="2.5" marker-end="url(#a)"/>
  <g filter="url(#f)"><rect x="552" y="378" width="412" height="106" rx="20" fill="#E2F1F7" stroke="#14161A" stroke-width="2.5"/></g>
  <text x="578" y="412" font-size="16" font-weight="700" fill="#14161A">Timetable — paste it, then flag it</text>
  <text x="578" y="436" font-size="13.5" fill="#14161A">Gives tips · sets coursework · attendance counted.</text>
  <text x="578" y="456" font-size="13.5" fill="#14161A">A flagged lecture is locked: nothing may move it.</text>

  <!-- 4 -->
  <g filter="url(#f)"><rect x="36" y="502" width="420" height="106" rx="20" fill="#FFFFFF" stroke="#C9C6BE" stroke-width="2"/></g>
  <circle cx="76" cy="540" r="20" fill="#8FE0C2" stroke="#14161A" stroke-width="2.2"/>
  <text x="76" y="547" font-size="19" text-anchor="middle">👥</text>
  <text x="112" y="536" font-size="15.5" font-weight="700" fill="#14161A">“Everyone’s busier than me, I won’t ask.”</text>
  <text x="112" y="560" font-size="13.5" fill="#565A62">Four friends each assume the other three are drowning,</text>
  <text x="112" y="580" font-size="13.5" fill="#565A62">so nobody suggests anything and nobody sees anyone.</text>
  <path d="M470 555 H540" stroke="#6B7079" stroke-width="2.5" marker-end="url(#a)"/>
  <g filter="url(#f)"><rect x="552" y="502" width="412" height="106" rx="20" fill="#EEF5E2" stroke="#14161A" stroke-width="2.5"/></g>
  <text x="578" y="536" font-size="16" font-weight="700" fill="#14161A">Friends — who actually has room</text>
  <text x="578" y="560" font-size="13.5" fill="#14161A">Their battery beside their name, and the evening that</text>
  <text x="578" y="580" font-size="13.5" fill="#14161A">suits everyone. A band, never a number.</text>

  <!-- 5 -->
  <g filter="url(#f)"><rect x="36" y="626" width="420" height="106" rx="20" fill="#FFFFFF" stroke="#C9C6BE" stroke-width="2"/></g>
  <circle cx="76" cy="664" r="20" fill="#FFD37A" stroke="#14161A" stroke-width="2.2"/>
  <text x="76" y="671" font-size="19" text-anchor="middle">⭐</text>
  <text x="112" y="660" font-size="15.5" font-weight="700" fill="#14161A">“I have twelve things. Which one do I start?”</text>
  <text x="112" y="684" font-size="13.5" fill="#565A62">Lists sort by what you typed first. Calendars sort by</text>
  <text x="112" y="704" font-size="13.5" fill="#565A62">the clock. Neither one sorts by what matters.</text>
  <path d="M470 679 H540" stroke="#6B7079" stroke-width="2.5" marker-end="url(#a)"/>
  <g filter="url(#f)"><rect x="552" y="626" width="412" height="106" rx="20" fill="#FBF0DC" stroke="#14161A" stroke-width="2.5"/></g>
  <text x="578" y="660" font-size="16" font-weight="700" fill="#14161A">What to do first — one ranked list</text>
  <text x="578" y="684" font-size="13.5" fill="#14161A">Deadline, promise, size, and can-it-still-be-finished.</text>
  <text x="578" y="704" font-size="13.5" fill="#14161A">Plus: of all this, what are you allowed to move?</text>
</svg>
