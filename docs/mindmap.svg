<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700" font-family="-apple-system, Segoe UI, Roboto, Helvetica, sans-serif">
  <defs>
    <radialGradient id="glow" cx="50%" cy="45%" r="60%">
      <stop offset="0" stop-color="#2A4034"/><stop offset="1" stop-color="#16261F"/>
    </radialGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#14161A" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="1000" height="700" fill="#FFF7EC" rx="18"/>

  <text x="40" y="52" font-size="26" font-weight="700" fill="#14161A">What we explored — and what survived</text>
  <text x="40" y="78" font-size="15" fill="#565A62">Eight ideas. Four are in the app. Four we killed, and here is why.</text>

  <!-- connectors -->
  <g fill="none" stroke-width="2.5" stroke-linecap="round">
    <path d="M420 350 C360 330 350 180 336 150" stroke="#C4A9F0"/>
    <path d="M420 350 C370 340 370 300 336 288" stroke="#8FE0C2"/>
    <path d="M420 350 C370 360 370 400 336 426" stroke="#9CCDF5"/>
    <path d="M420 350 C360 370 350 530 336 564" stroke="#FFB3D1"/>
    <path d="M580 350 C640 330 650 180 664 150" stroke="#C9C6BE" stroke-dasharray="7 6"/>
    <path d="M580 350 C630 340 630 300 664 288" stroke="#C9C6BE" stroke-dasharray="7 6"/>
    <path d="M580 350 C630 360 630 400 664 426" stroke="#C9C6BE" stroke-dasharray="7 6"/>
    <path d="M580 350 C640 370 650 530 664 564" stroke="#C9C6BE" stroke-dasharray="7 6"/>
  </g>

  <!-- centre -->
  <g filter="url(#s)"><circle cx="500" cy="350" r="84" fill="url(#glow)"/></g>
  <circle cx="500" cy="350" r="84" fill="none" stroke="#FFD37A" stroke-width="3"/>
  <text x="500" y="332" font-size="13" font-weight="700" fill="#FFD37A" text-anchor="middle" letter-spacing="1.4">THE BRIEF</text>
  <text x="500" y="362" font-size="19" font-weight="700" fill="#F7F6F2" text-anchor="middle">Beating the</text>
  <text x="500" y="385" font-size="19" font-weight="700" fill="#F7F6F2" text-anchor="middle">burnout</text>

  <text x="36" y="112" font-size="13" font-weight="700" fill="#1B5C46" letter-spacing="1.2">✓ BUILT</text>
  <text x="664" y="112" font-size="13" font-weight="700" fill="#6B7079" letter-spacing="1.2">✕ DROPPED, ON PURPOSE</text>

  <!-- kept -->
  <g filter="url(#s)">
    <rect x="36" y="124" width="300" height="112" rx="20" fill="#F0EAFC" stroke="#14161A" stroke-width="2.5"/>
    <rect x="36" y="262" width="300" height="112" rx="20" fill="#EEF5E2" stroke="#14161A" stroke-width="2.5"/>
    <rect x="36" y="400" width="300" height="112" rx="20" fill="#E2F1F7" stroke="#14161A" stroke-width="2.5"/>
    <rect x="36" y="538" width="300" height="112" rx="20" fill="#FAE9F5" stroke="#14161A" stroke-width="2.5"/>
  </g>
  <g font-size="16" font-weight="700" fill="#14161A">
    <text x="60" y="160">load = time × dread</text>
    <text x="60" y="298">A battery, with a face</text>
    <text x="60" y="436">The What-If simulator</text>
    <text x="60" y="574">The decline drafter</text>
  </g>
  <g font-size="13.5" fill="#14161A">
    <text x="60" y="184">The one multiplication every other</text>
    <text x="60" y="204">screen is downstream of. No planner</text>
    <text x="60" y="224">weighs a task by how much you mind it.</text>

    <text x="60" y="322">“13% left” lands in half a second.</text>
    <text x="60" y="342">“87% of capacity used” does not. Same</text>
    <text x="60" y="362">number, kinder end of it.</text>

    <text x="60" y="460">Being told to sleep more changes</text>
    <text x="60" y="480">nothing. Dragging a slider and watching</text>
    <text x="60" y="500">the battery move is arguable advice.</text>

    <text x="60" y="598">It does not just say what to cut — it</text>
    <text x="60" y="618">writes the message. “Actually, I’m going”</text>
    <text x="60" y="638">is a real button that re-plans the week.</text>
  </g>

  <!-- dropped -->
  <g>
    <rect x="664" y="124" width="300" height="112" rx="20" fill="#FFFFFF" stroke="#C9C6BE" stroke-width="2.5" stroke-dasharray="8 6"/>
    <rect x="664" y="262" width="300" height="112" rx="20" fill="#FFFFFF" stroke="#C9C6BE" stroke-width="2.5" stroke-dasharray="8 6"/>
    <rect x="664" y="400" width="300" height="112" rx="20" fill="#FFFFFF" stroke="#C9C6BE" stroke-width="2.5" stroke-dasharray="8 6"/>
    <rect x="664" y="538" width="300" height="112" rx="20" fill="#FFFFFF" stroke="#C9C6BE" stroke-width="2.5" stroke-dasharray="8 6"/>
  </g>
  <g font-size="16" font-weight="700" fill="#565A62">
    <text x="688" y="160">A Pomodoro timer</text>
    <text x="688" y="298">A mood journal</text>
    <text x="688" y="436">Streaks and leaderboards</text>
    <text x="688" y="574">An LLM doing the thinking</text>
  </g>
  <g font-size="13.5" fill="#565A62">
    <text x="688" y="184">Focus was never the problem. A student</text>
    <text x="688" y="204">juggling a job and coursework is</text>
    <text x="688" y="224">overcommitted, not distracted.</text>

    <text x="688" y="322">Dropped as a product, kept as a feature.</text>
    <text x="688" y="342">Logging a mood describes your week. It</text>
    <text x="688" y="362">survives only because it feeds the battery.</text>

    <text x="688" y="460">They punish exactly the weeks this app</text>
    <text x="688" y="480">exists for, and a leaderboard makes</text>
    <text x="688" y="500">suffering competitive.</text>

    <text x="688" y="598">A demo cannot depend on venue wifi.</text>
    <text x="688" y="618">Regex plus a keyword dictionary does the</text>
    <text x="688" y="638">same job, offline, and can be explained.</text>
  </g>
</svg>
