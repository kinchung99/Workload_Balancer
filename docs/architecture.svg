<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" font-family="-apple-system, Segoe UI, Roboto, Helvetica, sans-serif">
  <defs>
    <filter id="f" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#14161A" flood-opacity="0.10"/>
    </filter>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L9 5 L0 10 z" fill="#14161A"/>
    </marker>
    <marker id="w" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L9 5 L0 10 z" fill="#FFFFFF"/>
    </marker>
  </defs>

  <rect width="1200" height="720" fill="#FFF7EC" rx="18"/>
  <text x="40" y="52" font-size="26" font-weight="800" fill="#14161A">How Ballast is built</text>
  <text x="40" y="78" font-size="14" fill="#5D626B">One TypeScript contract shared by the app and the API · everything that decides runs on the phone · the server keeps rows, not opinions</text>

  <!-- ===================== the app ===================== -->
  <rect x="40" y="104" width="470" height="456" rx="16" fill="#FFFFFF" stroke="#14161A" stroke-width="2" filter="url(#f)"/>
  <text x="62" y="136" font-size="17" font-weight="800" fill="#14161A">📱 The app · ballast/</text>
  <text x="62" y="156" font-size="12" fill="#5D626B">Expo · React Native + web · one codebase for iPhone, Android, browser</text>

  <rect x="62" y="172" width="426" height="58" rx="10" fill="#F0EAFC"/>
  <text x="76" y="195" font-size="13.5" font-weight="700" fill="#14161A">app/  · screens and routes (Expo Router)</text>
  <text x="76" y="215" font-size="12" fill="#5D626B">Home · Plan · Friends · You, and 40+ pages behind them</text>

  <rect x="62" y="240" width="426" height="58" rx="10" fill="#FAE9F5"/>
  <text x="76" y="263" font-size="13.5" font-weight="700" fill="#14161A">src/features/ · one folder per feature</text>
  <text x="76" y="283" font-size="12" fill="#5D626B">timetable · item · social · compose · recover · rebalance · notify…</text>

  <rect x="62" y="308" width="426" height="76" rx="10" fill="#FBF0DC"/>
  <text x="76" y="331" font-size="13.5" font-weight="700" fill="#14161A">src/lib/ · the model, pure functions</text>
  <text x="76" y="351" font-size="12" fill="#5D626B">battery · load · forecast (the wall) · priority · prep (sittings)</text>
  <text x="76" y="369" font-size="12" fill="#5D626B">rebalance · together (free time) · timetable · marking · rest</text>

  <rect x="62" y="394" width="426" height="58" rx="10" fill="#EAF1F9"/>
  <text x="76" y="417" font-size="13.5" font-weight="700" fill="#14161A">src/state/ · one store, saved on the device</text>
  <text x="76" y="437" font-size="12" fill="#5D626B">Zustand + persist · snapshot diff → sync queue (local-first)</text>

  <rect x="62" y="462" width="205" height="76" rx="10" fill="#E8F2ED"/>
  <text x="76" y="485" font-size="13.5" font-weight="700" fill="#14161A">src/components/</text>
  <text x="76" y="505" font-size="12" fill="#5D626B">primitives · charts</text>
  <text x="76" y="523" font-size="12" fill="#5D626B">mascot · stickers</text>

  <rect x="283" y="462" width="205" height="76" rx="10" fill="#F1F0F3"/>
  <text x="297" y="485" font-size="13.5" font-weight="700" fill="#14161A">src/design/</text>
  <text x="297" y="505" font-size="12" fill="#5D626B">tokens.json ⇄ tokens.ts</text>
  <text x="297" y="523" font-size="12" fill="#5D626B">checked to stay in sync</text>

  <!-- ===================== shared contract ===================== -->
  <rect x="540" y="250" width="150" height="150" rx="16" fill="#14161A" filter="url(#f)"/>
  <text x="615" y="290" font-size="15" font-weight="800" fill="#FFFFFF" text-anchor="middle">shared/</text>
  <text x="615" y="312" font-size="12.5" fill="#D9DCE1" text-anchor="middle">contract.ts</text>
  <text x="615" y="340" font-size="11.5" fill="#D9DCE1" text-anchor="middle">zod schemas +</text>
  <text x="615" y="356" font-size="11.5" fill="#D9DCE1" text-anchor="middle">types, used by</text>
  <text x="615" y="372" font-size="11.5" fill="#D9DCE1" text-anchor="middle">both sides</text>
  <line x1="512" y1="325" x2="536" y2="325" stroke="#14161A" stroke-width="2" marker-end="url(#a)"/>
  <line x1="694" y1="325" x2="718" y2="325" stroke="#14161A" stroke-width="2" marker-end="url(#a)"/>
  <text x="613" y="430" font-size="12" fill="#5D626B" text-anchor="middle">HTTPS · bearer token</text>

  <!-- ===================== the api ===================== -->
  <rect x="722" y="104" width="438" height="330" rx="16" fill="#FFFFFF" stroke="#14161A" stroke-width="2" filter="url(#f)"/>
  <text x="744" y="136" font-size="17" font-weight="800" fill="#14161A">⚙️ The API · server/ on Vercel</text>
  <text x="744" y="156" font-size="12" fill="#5D626B">Hono · Better Auth · Drizzle ORM · one function</text>

  <g font-size="12.5" fill="#14161A">
    <rect x="744" y="172" width="196" height="30" rx="8" fill="#F6F5F2"/><text x="756" y="192">/api/auth · sign-in, tokens</text>
    <rect x="948" y="172" width="190" height="30" rx="8" fill="#F6F5F2"/><text x="960" y="192">/api/sync · your week</text>
    <rect x="744" y="208" width="196" height="30" rx="8" fill="#F6F5F2"/><text x="756" y="228">/api/circle · friends</text>
    <rect x="948" y="208" width="190" height="30" rx="8" fill="#F6F5F2"/><text x="960" y="228">/api/sharing · free time</text>
    <rect x="744" y="244" width="196" height="30" rx="8" fill="#F6F5F2"/><text x="756" y="264">/api/groups · /api/invites</text>
    <rect x="948" y="244" width="190" height="30" rx="8" fill="#F6F5F2"/><text x="960" y="264">/api/calendar · read-only</text>
    <rect x="744" y="280" width="196" height="30" rx="8" fill="#F0EAFC"/><text x="756" y="300">/api/compose · /api/suggest</text>
    <rect x="948" y="280" width="190" height="30" rx="8" fill="#FBE9EC"/><text x="960" y="300">/api/report · app errors</text>
    <rect x="744" y="316" width="394" height="30" rx="8" fill="#E8F2ED"/><text x="756" y="336">/health · /health/db — what the monitor calls</text>
  </g>
  <text x="744" y="372" font-size="12" fill="#5D626B">One gate checks the session before every private route.</text>
  <text x="744" y="390" font-size="12" fill="#5D626B">Friends only ever see battery, note and shared free time —</text>
  <text x="744" y="408" font-size="12" fill="#5D626B">the schema has no column for anyone's tasks.</text>

  <!-- ===================== services ===================== -->
  <g font-size="13" font-weight="700" fill="#14161A">
    <rect x="722" y="462" width="138" height="66" rx="12" fill="#EAF1F9" stroke="#14161A" stroke-width="1.5"/>
    <text x="791" y="490" text-anchor="middle">🐘 Neon</text><text x="791" y="510" text-anchor="middle" font-size="11.5" font-weight="400" fill="#5D626B">Postgres</text>
    <rect x="872" y="462" width="138" height="66" rx="12" fill="#F0EAFC" stroke="#14161A" stroke-width="1.5"/>
    <text x="941" y="490" text-anchor="middle">✨ Gemini</text><text x="941" y="510" text-anchor="middle" font-size="11.5" font-weight="400" fill="#5D626B">messages · advice</text>
    <rect x="1022" y="462" width="138" height="66" rx="12" fill="#E2F1F7" stroke="#14161A" stroke-width="1.5"/>
    <text x="1091" y="490" text-anchor="middle">📅 Google</text><text x="1091" y="510" text-anchor="middle" font-size="11.5" font-weight="400" fill="#5D626B">Calendar, read-only</text>
  </g>
  <line x1="791" y1="436" x2="791" y2="458" stroke="#14161A" stroke-width="2" marker-end="url(#a)"/>
  <line x1="941" y1="436" x2="941" y2="458" stroke="#14161A" stroke-width="2" marker-end="url(#a)"/>
  <line x1="1091" y1="436" x2="1091" y2="458" stroke="#14161A" stroke-width="2" marker-end="url(#a)"/>
  <text x="941" y="550" font-size="11.5" fill="#5D626B" text-anchor="middle">No AI key or a busy model? The app writes the text itself.</text>

  <!-- ===================== ship & watch ===================== -->
  <rect x="40" y="586" width="1120" height="110" rx="16" fill="#14161A"/>
  <text x="62" y="616" font-size="15" font-weight="800" fill="#FFFFFF">🚀 Ship and watch · .github/workflows</text>
  <g font-size="12.5" fill="#FFFFFF">
    <rect x="62" y="630" width="250" height="50" rx="10" fill="#2B7A5E"/>
    <text x="76" y="651" font-weight="700">checks · every push</text>
    <text x="76" y="669" fill="#DDEFE6">1,100+ checks · app and API</text>
    <rect x="336" y="630" width="250" height="50" rx="10" fill="#2C5C8F"/>
    <text x="350" y="651" font-weight="700">deploy · after checks pass</text>
    <text x="350" y="669" fill="#DCE8F5">API → Vercel · app → Expo hosting ×3</text>
    <rect x="610" y="630" width="250" height="50" rx="10" fill="#7A5200"/>
    <text x="624" y="651" font-weight="700">monitor · every 30 min</text>
    <text x="624" y="669" fill="#F6E6C6">signs in like a judge · opens an issue</text>
    <rect x="884" y="630" width="254" height="50" rx="10" fill="#A31C38"/>
    <text x="898" y="651" font-weight="700">error reports · from phones</text>
    <text x="898" y="669" fill="#F7DCE2">crash screen → /api/report → logs</text>
  </g>
  <line x1="312" y1="655" x2="332" y2="655" stroke="#FFFFFF" stroke-width="2" marker-end="url(#w)"/>
  <line x1="586" y1="655" x2="606" y2="655" stroke="#FFFFFF" stroke-width="2" marker-end="url(#w)"/>
</svg>
