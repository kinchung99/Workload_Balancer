<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 420" width="940" height="420" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <rect width="940" height="420" fill="#FFFFFF"/>
  <text x="24" y="32" font-size="15" font-weight="700" fill="#14161A">User flow — the loop that prevents a bad week</text>
  <text x="24" y="52" font-size="12" fill="#6B7079">Amira, week 10. Every box is a screen that exists in the prototype.</text>

  <g stroke="#16261F" stroke-width="1.8" fill="none" marker-end="url(#a)">
    <defs>
      <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
        <path d="M0 0 L8 4.5 L0 9 z" fill="#16261F"/>
      </marker>
    </defs>
    <path d="M170 116 H214"/>
    <path d="M360 116 H404"/>
    <path d="M550 116 H594"/>
    <path d="M740 140 V196"/>
    <path d="M690 232 H360"/>
    <path d="M264 268 V318"/>
    <path d="M170 344 H214"/>
    <path d="M454 344 H500"/>
  </g>

  <g stroke-width="1.8">
    <rect x="24" y="88" width="146" height="56" rx="12" fill="#E2F1F7" stroke="#0C6E8F"/>
    <rect x="214" y="88" width="146" height="56" rx="12" fill="#E2F1F7" stroke="#0C6E8F"/>
    <rect x="404" y="88" width="146" height="56" rx="12" fill="#FBE9EC" stroke="#B32540"/>
    <rect x="594" y="88" width="292" height="56" rx="12" fill="#FBE9EC" stroke="#B32540"/>
    <rect x="594" y="196" width="292" height="72" rx="12" fill="#FBF0DC" stroke="#C4881B"/>
    <rect x="214" y="196" width="292" height="72" rx="12" fill="#FBF0DC" stroke="#C4881B"/>
    <rect x="24" y="318" width="146" height="56" rx="12" fill="#EAF1F9" stroke="#6B95C9"/>
    <rect x="214" y="318" width="240" height="56" rx="12" fill="#EAF1F9" stroke="#6B95C9"/>
    <rect x="500" y="318" width="386" height="56" rx="12" fill="#E8F2ED" stroke="#2F8265"/>
  </g>

  <g font-size="12" fill="#14161A">
    <text x="38" y="112" font-weight="700">Add anything</text><text x="38" y="130">one box, one dread tap</text>
    <text x="228" y="112" font-weight="700">Home</text><text x="228" y="130">13% · a face, five areas</text>
    <text x="418" y="112" font-weight="700">Plan</text><text x="418" y="130">14 days, tap any day</text>
    <text x="608" y="112" font-weight="700">Collision found — 8 days out</text><text x="608" y="130">four things inside 72 hours</text>

    <text x="608" y="222" font-weight="700">Rebalance</text>
    <text x="608" y="240">toggle trades, battery moves live</text>
    <text x="608" y="258">hard deadlines locked, recovery protected</text>

    <text x="228" y="222" font-weight="700">Saying no</text>
    <text x="228" y="240">the message written for you, three tones</text>
    <text x="228" y="258">“Actually, I’m going” re-plans instead</text>

    <text x="38" y="342" font-weight="700">Recover</text><text x="38" y="360">the debt, in hours</text>
    <text x="228" y="342" font-weight="700">Book it at a real time</text><text x="228" y="360">picked from gaps that exist</text>
    <text x="514" y="342" font-weight="700">Wednesday evening opens up</text>
    <text x="514" y="360">the first free evening in eleven days</text>
  </g>

  <text x="24" y="400" font-size="11.5" fill="#6B7079">Daily cost to the student: one dread tap when something goes in, and one tap on the widget. That is the whole ask.</text>
</svg>
