# The live service, checked from the outside every 30 minutes.
#
# scripts/monitor.mjs signs in like a person would and walks the paths a judge
# would notice breaking: API, database, app, demo, sign-in, sync, friends,
# plans. Every run leaves a table in its summary. A failure opens one issue
# labelled `monitor` (or comments on the open one); the first green run after
# that closes it - so the issue list is the outage log.
name: monitor

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  live:
    name: live checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - id: run
        run: node scripts/monitor.mjs
        continue-on-error: true
        env:
          MONITOR_PASSWORD: ${{ secrets.MONITOR_PASSWORD }}
          MONITOR_REPORT: ${{ runner.temp }}/report.md

      - name: Raise or update the outage issue
        if: steps.run.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create monitor --color D93F0B --description "Live check failed" 2>/dev/null || true
          body="$(cat "$RUNNER_TEMP/report.md")"$'\n\n'"Run: $RUN"
          open=$(gh issue list --label monitor --state open --json number --jq '.[0].number')
          if [ -n "$open" ]; then gh issue comment "$open" --body "$body"
          else gh issue create --title "🔴 Live check failed" --label monitor --body "$body"; fi
          exit 1

      - name: Close the outage issue once it recovers
        if: steps.run.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for n in $(gh issue list --label monitor --state open --json number --jq '.[].number'); do
            gh issue close "$n" --comment "🟢 Recovered: every live check passed at $(date -u +%FT%TZ)."
          done
