# Every check that gates a deploy, on every push.
#
# The two halves are checked independently because they fail for different
# reasons: the app's suites are pure and fast, and the API's spin up Postgres in
# WebAssembly. Neither needs a service, a container or a secret, which is why
# this workflow costs nothing and never flakes on a provider being down.
name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    name: app — model, behaviour, render, tokens
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The shared contract is a workspace of the root package, so this installs
      # it and the server in one pass.
      - run: npm ci
      - run: npm ci
        working-directory: ballast
      - run: npm run preflight
        working-directory: ballast

  api:
    name: api — 72 checks against real Postgres
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run preflight
        working-directory: server
