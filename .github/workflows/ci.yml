# Every check that gates a deploy, on every push.
#
# The two halves are checked independently because they fail for different
# reasons: the app's suites are pure and fast, and the API's spin up Postgres in
# WebAssembly. Neither needs a service, a container or a secret, which is why
# this workflow costs nothing and never flakes on a provider being down.
name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    name: app — model, behaviour, render, tokens
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ballast/package-lock.json
      - name: Install the contract
        run: npm ci --prefix shared
      - run: npm ci
        working-directory: ballast
      - run: npm run preflight
        working-directory: ballast

  api:
    name: api — 58 checks against real Postgres
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install the contract
        run: npm ci --prefix shared
      - run: npm ci
        working-directory: server
      - run: npm run preflight
        working-directory: server
